; Minimal example consuming r2provisioning and r2common as libraries.
; Both are linked via symlinks relative to this directory:
;   ../../            -> r2provisioning (this library)
;   ../../../../r2common/lib/r2common -> Arduino/r2common

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    symlink://../../
    symlink://../../../../r2common/lib/r2common

[env:esp32dev]
platform = espressif32
board = esp32dev

[env:esp8266]
platform = espressif8266
board = esp12e
upload_speed = 115200
