; PlatformIO Project Configuration File
;
; Root sandbox build (src/main.cpp + the library sources under src/r2provisioning/).
;
; r2common is NOT vendored: it is linked from the sibling checkout
; ../../r2common/lib/r2common (i.e. Arduino/r2common) via a symlink lib_dep,
; so edits there are picked up directly. Examples do the same, with a path
; relative to their own directory.
;
; https://docs.platformio.org/page/projectconf.html

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    symlink://../../r2common/lib/r2common

[env:esp32dev]
platform = espressif32
board = esp32dev

[env:esp8266]
platform = espressif8266
board = esp12e
upload_speed = 921600
