; PlatformIO Project Configuration File
;
; https://docs.platformio.org/page/projectconf.html

; Shared settings for the root sandbox build (src/main.cpp).
;
; r2common is vendored as a git subtree under src/r2Common/ (same layout as
; r2com). Include its library headers (R2Logger.h, Network/WiFiConnection.h,
; ...) so the sketch and library sources can resolve them. The examples consume
; r2common as a proper library and don't need these flags.
;
; The vendored r2common subtree ships its own sandbox/example mains
; (r2Common/examples/**, r2Common/src/main.cpp). Since the root project compiles
; src/ recursively, those would collide with our setup()/loop(). Keep the
; r2common *library* sources (r2Common/lib/**) but exclude the subtree's stray
; mains and tests.
[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -Isrc/r2Common/lib/r2common/src
    -Isrc/r2Common/lib/r2common/src/Network
build_src_filter =
    +<*>
    -<r2Common/examples/>
    -<r2Common/src/>
    -<r2Common/test/>

[env:esp32dev]
platform = espressif32
board = esp32dev

[env:esp8266]
platform = espressif8266
board = esp12e
upload_speed = 921600
